<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Picture of the Day</title>
  <style>
    body {
      margin: 0;
      padding: 2rem 1rem 4rem;
      background: #0a0a0b;
      color: #ececf1;
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
    .date { color: #8b8b96; font-size: 0.9rem; margin: 0 0 1.5rem; }
    img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      background: #000;
    }
    h2 { font-size: 1.2rem; margin: 1.25rem 0 0.5rem; font-weight: 600; }
    p { margin: 0 0 1rem; color: #c9c9d1; }
    a { color: #6aa9ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .credit {
      color: #8b8b96;
      font-size: 0.85rem;
      border-top: 1px solid #26262b;
      padding-top: 0.75rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Picture of the Day</h1>
    <p class="date" id="date">Loading…</p>
    <img id="img" alt="" hidden />
    <h2 id="title"></h2>
    <p id="desc"></p>
    <p class="credit">
      <a id="link" href="#" target="_blank" rel="noopener">View on Wikimedia Commons →</a>
    </p>
  </main>
  <script>
    fetch("data/potd.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => r.json())
      .then((d) => {
        const img = document.getElementById("img");
        img.src = d.image_url;
        img.alt = d.title || "Picture of the Day";
        img.hidden = false;
        document.getElementById("title").textContent = d.title || "";
        document.getElementById("desc").textContent = d.description || "";
        document.getElementById("link").href = d.file_page || d.image_url;
        document.getElementById("date").textContent = new Date(d.date + "T00:00:00Z")
          .toLocaleDateString(undefined, {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
            timeZone: "UTC",
          });
      })
      .catch((e) => {
        document.getElementById("date").textContent = "Error: " + e.message;
      });
  </script>
</body>
</html>
