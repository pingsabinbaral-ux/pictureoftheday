name: Build and deploy POTD

on:
  push:
    branches: [main]
  schedule:
    - cron: "55 0 * * *"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch today's picture
        run: |
          mkdir -p public/data
          python - <<'PY'
          import json, urllib.request, datetime as dt
          from pathlib import Path

          today = dt.datetime.now(dt.timezone.utc).date()
          url = (f"https://api.wikimedia.org/feed/v1/wikipedia/en/featured/"
                 f"{today.year}/{today.month:02d}/{today.day:02d}")

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "daily-potd/1.0 (+https://github.com/pingsabinbaral-ux/pictureoftheday)"},
          )
          with urllib.request.urlopen(req, timeout=25) as r:
              feed = json.load(r)

          img = feed["image"]
          thumb = img.get("thumbnail") or {}

          payload = {
              "date": today.isoformat(),
              "title": img.get("title", ""),
              "description": img.get("description", {}).get("text", ""),
              "image_url": thumb.get("source"),
              "file_page": img.get("file_page"),
          }

          out = Path("public/data/potd.json")
          out.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n")
          print(f"Wrote {out} — {payload['title']}")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
